<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHAN BHAI - Township Voting System</title>

  <style>
    :root {
      --bg: #000000;
      --white: #FFFFFF;
      --sky: #56CCF2;
      --red: #FF3333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .brand {
      margin: 18px 0 5px;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: var(--sky);
      font-size: 14px;
      letter-spacing: 2px;
    }

    .status {
      margin: 20px 0;
      padding: 15px 10px;
      border: 1px solid var(--sky);
      border-radius: 10px;
      color: var(--white);
      line-height: 1.7;
    }

    .countdown {
      margin-top: 10px;
      color: var(--sky);
      font-size: clamp(27px, 8vw, 36px);
      font-weight: bold;
      letter-spacing: 2px;
    }

    .section-title {
      margin: 28px 0 14px;
      font-size: 17px;
      font-weight: bold;
    }

    select,
    button {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    select {
      border: 1px solid var(--sky);
      background: var(--bg);
      color: var(--white);
      outline: none;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--sky);
      background: var(--bg);
      color: var(--white);
      font-weight: bold;
    }

    button:active {
      opacity: 0.75;
    }

    .primary-button {
      margin-top: 14px;
      background: var(--sky);
      color: #000000;
    }

    .announcement-title {
      margin-top: 38px;
      color: var(--red);
      font-weight: bold;
      font-size: 18px;
    }

    .announcement-button {
      margin-top: 12px;
      border: 1px solid var(--sky);
      color: var(--white);
      background: var(--bg);
    }

    .results {
      margin-top: 28px;
      text-align: left;
    }

    .result-row {
      margin: 15px 0;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 10px;
      background: #242424;
    }

    .progress-bar {
      height: 100%;
      border-radius: 10px;
      background: var(--sky);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.85);
    }

    .modal-box {
      width: 100%;
      max-width: 350px;
      padding: 24px 18px;
      border: 1px solid var(--sky);
      border-radius: 14px;
      background: #050505;
    }

    .modal-title {
      margin: 0 0 18px;
      font-size: 21px;
      font-weight: bold;
    }

    .modal-message {
      margin: 15px 0;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
      min-width: 0;
      font-size: 14px;
    }

    .sky-text {
      color: var(--sky);
    }

    .checkmark {
      margin: 10px 0;
      color: var(--sky);
      font-size: 54px;
    }

    .selected-box {
      margin: 18px 0;
      padding: 15px 8px;
      border: 1px solid var(--sky);
      border-radius: 8px;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    #message {
      margin-top: 15px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    @media (max-width: 360px) {
      body {
        padding: 15px 10px;
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: 1px;
      }

      .modal-box {
        padding: 20px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1 class="brand">KHAN BHAI</h1>
      <div class="subtitle">TOWNSHIP VOTING SYSTEM</div>
    </header>

    <section class="status">
      <div id="statusText">Voting အခြေအနေကို စစ်ဆေးနေသည်...</div>
      <div id="countdown" class="countdown">00:00:00</div>
    </section>

    <section id="votingSection">
      <div class="section-title">Voting လုပ်ရန် မြို့နယ်ရွေးပါ</div>

      <select id="townshipSelect">
        <option value="">မြို့နယ်ရွေးချယ်ပါ</option>
        <option>အလုံ</option>
        <option>ဗဟန်း</option>
        <option>ဗိုလ်တထောင်</option>
        <option>ဒဂုံ</option>
        <option>ဒဂုံမြို့သစ် (အရှေ့ပိုင်း)</option>
        <option>ဒဂုံမြို့သစ် (မြောက်ပိုင်း)</option>
        <option>ဒဂုံမြို့သစ် (တောင်ပိုင်း)</option>
        <option>ဒဂုံမြို့သစ် (ဆိပ်ကမ်း)</option>
        <option>ဒလ</option>
        <option>ဒေါပုံ</option>
        <option>အင်းစိန်</option>
        <option>ကမာရွတ်</option>
        <option>ကော့မှူး</option>
        <option>ကျောက်တံတား</option>
        <option>ကြည့်မြင်တိုင်</option>
        <option>လှိုင်</option>
        <option>လှိုင်သာယာ (အရှေ့ပိုင်း)</option>
        <option>လှိုင်သာယာ (အနောက်ပိုင်း)</option>
        <option>လမ်းမတော်</option>
        <option>လသာ</option>
        <option>မင်္ဂလာဒုံ</option>
        <option>မင်္ဂလာတောင်ညွန့်</option>
        <option>မြောက်ဥက္ကလာပ</option>
        <option>ပန်းဘဲတန်း</option>
        <option>ပုဇွန်တောင်</option>
        <option>စမ်းချောင်း</option>
        <option>ဆိပ်ကမ်း</option>
        <option>ရွှေပြည်သာ</option>
        <option>တောင်ဥက္ကလာပ</option>
        <option>တာမွေ</option>
        <option>သင်္ဃန်းကျွန်း</option>
        <option>သန်လျင်</option>
        <option>ရန်ကင်း</option>
      </select>

      <button id="voteButton" class="primary-button">
        အတည်ပြုမည်
      </button>

      <div id="message"></div>
    </section>

    <section>
      <div class="announcement-title">အသိပေးကြေညာချက်!</div>
      <button id="announcementButton" class="announcement-button">
        ကြေညာချက်ကြည့်ရန်
      </button>
    </section>

    <section id="resultsSection" class="results hidden">
      <h2 class="section-title">VOTING RESULTS</h2>
      <div id="resultsList"></div>
    </section>

  </main>

  <!-- Vote confirmation popup -->
  <div id="confirmModal" class="modal">
    <div class="modal-box">
      <h2 class="modal-title">အတည်ပြုရန်</h2>
      <div class="modal-message">
        ရွေးချယ်ထားသော မြို့နယ် -
        <strong id="confirmTownship" class="sky-text"></strong>
      </div>
      <div class="modal-buttons">
        <button id="cancelVote">မလုပ်တော့ပါ</button>
        <button id="confirmVote" class="primary-button">အတည်ပြုမည်</button>
      </div>
    </div>
  </div>

  <!-- Vote success popup -->
  <div id="successModal" class="modal">
    <div class="modal-box">
      <h2 class="modal-title">Vote Successful!</h2>
      <div class="checkmark">✓</div>
      <div class="selected-box">
        <div>သင်ရွေးချယ်ထားသော မြို့နယ်</div>
        <strong id="successTownship" class="sky-text"></strong>
      </div>
      <button id="closeSuccess" class="primary-button">ပိတ်မည်</button>
    </div>
  </div>

  <!-- Announcement popup -->
  <div id="announcementModal" class="modal">
    <div class="modal-box">
      <h2 class="modal-title" style="color: var(--red);">
        အသိပေးကြေညာချက်!
      </h2>
      <div id="announcementContent" class="modal-message">
        ကြေညာချက် မရှိသေးပါ။
      </div>
      <button id="closeAnnouncement">ပိတ်မည်</button>
    </div>
  </div>

  <script>
    /*
      သတိပြုရန်:
      ဤနေရာတွင် လက်ရှိ Website ၏ Supabase URL နှင့်
      anon/publishable key ကို မှန်ကန်စွာ ထည့်သွင်းရပါမည်။
      လက်ရှိအချက်အလက် မအတည်ပြုရသေးသောကြောင့်
      ဒီ Coding ကို Live Database နဲ့ အလုပ်လုပ်ပြီးသားဟု
      မယူဆပါနှင့်။
    */

    const SUPABASE_URL =
      "https://vefqgexluwfwabdapklf.supabase.co";

    const SUPABASE_KEY =
      "YOUR_EXISTING_SUPABASE_ANON_OR_PUBLISHABLE_KEY";

    const MYANMAR_OFFSET = 6.5 * 60 * 60 * 1000;

    let votingOpen = false;
    let selectedTownship = "";
    let announcementText = "";
    let countdownTimer = null;

    const $ = (id) => document.getElementById(id);

    function getMyanmarTime() {
      return new Date(Date.now() + MYANMAR_OFFSET);
    }

    function formatTime(number) {
      return String(number).padStart(2, "0");
    }

    function updateCountdown() {
      const now = getMyanmarTime();
      const currentSeconds =
        now.getUTCHours() * 3600 +
        now.getUTCMinutes() * 60 +
        now.getUTCSeconds();

      const openingSeconds = 10 * 3600;
      const closingSeconds = 22 * 3600;

      let remaining;

      if (currentSeconds < openingSeconds) {
        remaining = openingSeconds - currentSeconds;
        $("statusText").textContent = "Voting မဖွင့်သေးပါ";
      } else if (currentSeconds < closingSeconds) {
        remaining = closingSeconds - currentSeconds;
        $("statusText").textContent = "Voting ဖွင့်ထားသည်";
      } else {
        remaining = 24 * 3600 - currentSeconds + openingSeconds;
        $("statusText").textContent = "Voting ပိတ်ထားသည်";
      }

      const hours = Math.floor(remaining / 3600);
      const minutes = Math.floor((remaining % 3600) / 60);
      const seconds = remaining % 60;

      $("countdown").textContent =
        formatTime(hours) + ":" +
        formatTime(minutes) + ":" +
        formatTime(seconds);

      votingOpen =
        currentSeconds >= openingSeconds &&
        currentSeconds < closingSeconds;

      $("votingSection").classList.toggle("hidden", !votingOpen);
    }

    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);

    $("voteButton").addEventListener("click", () => {
      if (!votingOpen) {
        $("message").textContent = "Voting ပိတ်ထားသည်။";
        return;
      }

      selectedTownship = $("townshipSelect").value;

      if (!selectedTownship) {
        $("message").textContent = "မြို့နယ်ကို အရင်ရွေးချယ်ပါ။";
        return;
      }

      $("confirmTownship").textContent = selectedTownship;
      $("confirmModal").style.display = "flex";
    });

    $("cancelVote").addEventListener("click", () => {
      $("confirmModal").style.display = "none";
    });

    $("confirmVote").addEventListener("click", async () => {
      /*
        ဒီနေရာမှာ လက်ရှိ Website မှာ အသုံးပြုနေသော
        Database vote submission code ကို ထည့်ရပါမည်။
        Database မချိတ်ဆက်ရသေးသောကြောင့်
        အောင်မြင်ကြောင်း အတုအယောင် မပြပါ။
      */

      $("confirmModal").style.display = "none";
      $("message").textContent =
        "Database ချိတ်ဆက်မှု Coding ကို အတည်ပြုပြီးမှ Vote တင်နိုင်ပါမည်။";
    });

    $("closeSuccess").addEventListener("click", () => {
      $("successModal").style.display = "none";
    });

    $("announcementButton").addEventListener("click", () => {
      $("announcementContent").textContent =
        announcementText || "ကြေညာချက် မရှိသေးပါ။";
      $("announcementModal").style.display = "flex";
    });

    $("closeAnnouncement").addEventListener("click", () => {
      $("announcementModal").style.display = "none";
    });
  </script>
</body>
</html>
